spring:
  application:
    name: backend-everyrecommand

  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  sql:
    init:
      mode: never
#=============================파일 관련 설정================================
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 2GB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    default-statement-timeout: 10
app:
  frontend:
    api-url: ${PUBLIC_API_URL:/api}
    websocket-url: ${PUBLIC_WEBSOCKET_URL:}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:}
