spring:
    config:
        activate:
            on-profile: postgres
#===============================================================
#JDBC 설정
#===============================================================
    datasource:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://127.0.0.1:5432/monoparty
      username: postgres
      password: postgres
#=================================================================
#SQL 초기화 설정
#=================================================================
#INIT, CREATE, none
    sql:
        init:
            mode: never

#===========================================================
#Mybatis 설정
#===========================================================
mybatis:
    mapper-locations: classpath:mapper/**/*.xml