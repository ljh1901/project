spring:
    config:
        activate:
            on-profile: postgres
#===============================================================
#JDBC 설정
#===============================================================
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        hikari:
            maximum-pool-size: ${DB_POOL_SIZE:10}
#=================================================================
#SQL 초기화 설정
#=================================================================
#INIT, CREATE, none
    sql:
        init:
            mode: never

#===========================================================
#Mybatis 설정
#===========================================================
mybatis:
    mapper-locations: classpath:mapper/**/*.xml
    configuration:
    default-statement-timeout: 10