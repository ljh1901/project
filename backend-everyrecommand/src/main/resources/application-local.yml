spring:
  config:
    activate:
      on-profile: local
server:
  servlet:
    session:
      cookie:
        secure: false
app:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://${app.frontend.dev-host}:${app.frontend.dev-port},http://localhost:${app.frontend.dev-port}}
  frontend:
    auto-start: ${FRONTEND_AUTO_START:true}
    directory: ${FRONTEND_DIRECTORY:front-everyrecommand}
    node-executable: ${FRONTEND_NODE_EXECUTABLE:node}
    dev-host: ${FRONTEND_DEV_HOST:127.0.0.1}
    dev-port: ${FRONTEND_DEV_PORT:5446}
    backend-host: ${FRONTEND_BACKEND_HOST:127.0.0.1}
    backend-proxy-target: ${FRONTEND_BACKEND_PROXY_TARGET:}
